    /* Antes de dibujar: el tema y el color de la barra de estado de la última vez (el iPhone lo toma al abrir la app),
       y el alto real de la pantalla (sin la barra de estado translúcida, 100vh mide de más en el iPhone). */
    try {
      const g = JSON.parse(localStorage.getItem("rumbo-tema-inicio") || "null"), i = matchMedia("(prefers-color-scheme: dark)").matches ? 1 : 0;
      if (g && g.t && g.c) { document.documentElement.dataset.theme = g.t[i]; document.querySelector('meta[name="theme-color"]').content = g.c[i]; }
    } catch (e) {}
    const altoApp = () => document.documentElement.style.setProperty("--alto-app", innerHeight + "px");
    altoApp(); addEventListener("resize", altoApp);
  </script>

  <script>
    /* Versión nueva: el service worker nuevo se activa solo y toma la página. Si la app recién se abrió
       (o volvió del fondo), se recarga al tiro para mostrar lo nuevo; si la estás usando, un aviso ofrece
       actualizar, para no perder lo que escribes. Al volver a la app se busca si hay una versión nueva. */
    if ("serviceWorker" in navigator) {
      const habia = !!navigator.serviceWorker.controller;   // en la primera instalación no hay nada que actualizar
      let visibleDesde = performance.now(), recargando = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!habia || recargando) return;
        if (performance.now() - visibleDesde < 10000) { recargando = true; location.reload(); return; }
        if (typeof toastAccion === "function") toastAccion("Hay una versión nueva de Rumbo", "Actualizar", () => location.reload());
      });
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(reg => {
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState !== "visible") return;
