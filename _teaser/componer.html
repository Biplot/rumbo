<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rumbo · Teaser</title>
<!-- El compositor del teaser: arma cada cuadro desde escenas.json (fondo, teléfono con la toma de la app,
     cámara, toques, textos, elefante y cierre). render.cjs llama a window.cuadro(t) y saca una foto por cuadro.
     Abierto en el navegador (?formato=916 o 169) se reproduce solo, para revisar. -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Norte noche, el tema propio de Rumbo (css/styles.css): índigo de acento y la aguja ámbar */
:root{--fondo:#0C0F1E;--fondo2:#141932;--marco:#1C2242;--txt:#EEF0F8;--suave:#C3C8DE;--indigo:#8D9BFF;--ambar:#FFBE55;--tinta:#0C0F1E}
*{box-sizing:border-box;margin:0}
html,body{background:#000;overflow:hidden}
#lienzo{position:relative;overflow:hidden;background:var(--fondo);font-family:Figtree,system-ui,sans-serif;color:var(--txt);transform-origin:0 0}
#estrellas{position:absolute;inset:0}
#tel{position:absolute;left:0;top:0;width:440px;height:940px;transform-origin:0 0;will-change:transform}
.marco{position:absolute;inset:0;border-radius:64px;background:linear-gradient(145deg,#2A3160,#161B36 60%);box-shadow:0 60px 120px -30px rgba(0,0,0,.8),inset 0 0 0 2px rgba(255,255,255,.14),inset 0 0 0 9px #0B0E1C}
.pantalla{position:absolute;left:15px;top:26px;width:410px;height:888px;border-radius:50px;overflow:hidden;background:var(--fondo)}
.pantalla img{position:absolute;inset:0;width:100%;height:100%;display:block}
.isla{position:absolute;left:50%;top:38px;width:118px;height:34px;margin-left:-59px;border-radius:20px;background:#05060C;z-index:3}
.toque{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:4px solid rgba(255,255,255,.95);box-shadow:0 0 0 6px rgba(141,155,255,.35);opacity:0;z-index:4}
.toque i{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:rgba(255,255,255,.95)}
#texto{position:absolute;font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;letter-spacing:-.03em;line-height:1.02;text-shadow:0 6px 30px rgba(5,7,18,.85),0 2px 6px rgba(5,7,18,.6)}
#texto .linea{display:block;white-space:nowrap}
#texto .p{display:inline-block;will-change:transform,opacity}
#texto .acento{color:var(--ambar)}
#texto .etq{display:inline-block;margin-top:30px;padding:10px 28px;border-radius:999px;font:700 46px/1.2 Figtree,sans-serif;letter-spacing:0;text-shadow:none;background:rgba(141,155,255,.16);box-shadow:inset 0 0 0 2px rgba(141,155,255,.55);color:var(--txt);font-variant-numeric:tabular-nums}
#texto .etq.ya{background:var(--ambar);box-shadow:0 10px 30px -8px rgba(255,190,85,.7);color:var(--tinta)}
#barrido{position:absolute;left:0;right:0;height:6px;margin-top:-3px;background:var(--ambar);box-shadow:0 0 24px 8px rgba(255,190,85,.75);opacity:0;z-index:2}
#velo{position:absolute;left:0;right:0;top:0;pointer-events:none}
#ele{position:absolute;left:0;top:0;transform-origin:50% 100%}
#ele svg{width:100%;height:100%;overflow:visible}
#cierre{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
#cierre[hidden]{display:none}
#cierre .caja{display:grid;justify-items:center}
#cierre .logo{display:flex;align-items:center;gap:28px}
#cierre .logo img{border-radius:28%;box-shadow:0 20px 60px -10px rgba(255,190,85,.45)}
#cierre .marca{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.04em}
#cierre .frase{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;letter-spacing:-.03em;color:var(--txt)}
#cierre .cta{border-radius:999px;background:var(--ambar);color:var(--tinta);font-weight:800;box-shadow:0 24px 50px -18px rgba(255,190,85,.7)}
#cierre .ele2{position:absolute;transform-origin:50% 100%}
#cierre .ele2 svg{width:100%;height:100%;overflow:visible}
#guia{position:absolute;inset:0;pointer-events:none;display:none}
#guia.ver{display:block}
#guia div{position:absolute;left:0;right:0;background:rgba(255,0,80,.18);border:2px dashed rgba(255,0,80,.7)}
</style>
</head>
<body>
<div id="lienzo">
  <canvas id="estrellas"></canvas>
  <div id="tel"><div class="marco"></div><div class="pantalla"><img id="toma" alt=""><img id="toma2" alt=""><div id="barrido"></div><div class="toque" id="toque"><i></i></div></div></div>
  <div id="velo"></div>
  <div id="ele"></div>
  <div id="texto"></div>
  <div id="cierre" hidden><div class="caja">
    <div class="logo"><img src="../assets/icon-180.png" alt=""><span class="marca">Rumbo</span></div>
    <p class="frase"></p>
    <p class="cta"></p>
  </div><div class="ele2"></div></div>
  <div id="guia"><div id="g-arriba" style="top:0"></div><div id="g-abajo" style="bottom:0"></div></div>
</div>
<script>
/* ---------- Formato ---------- */
const Q = new URLSearchParams(location.search);
const FORMATO = Q.get("formato") === "169" ? "169" : "916";
const F = FORMATO === "916"
  ? { W: 1080, H: 1920, cx: 540, cy: 1160, k: 0.95, u: 1, zoom: 1,
      texto: { left: 0, right: 0, top: 300, size: 100, align: "center" }, velo: 760,
      ele: { x0: -360, x1: 120, y: 1555, w: 320 }, seguro: { arriba: 0.14, abajo: 0.20 } }
  : { W: 1920, H: 1080, cx: 1400, cy: 560, k: 0.98, u: 0.6, zoom: 0.55,
      texto: { left: 150, right: null, top: null, size: 112, align: "left" }, velo: 0,
      ele: { x0: -360, x1: 330, y: 1010, w: 300 }, seguro: { arriba: 0.08, abajo: 0.10 } };
const L = document.getElementById("lienzo");
L.style.width = F.W + "px"; L.style.height = F.H + "px";
function ajustar() { const z = Math.min(innerWidth / F.W, innerHeight / F.H); L.style.transform = Q.has("render") ? "none" : `scale(${z})`; }
addEventListener("resize", ajustar);

/* ---------- Utilidades ---------- */
const lerp = (a, b, p) => a + (b - a) * p;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const inercia = p => 1 - Math.pow(1 - clamp(p), 4);          // sale rápido y frena: el movimiento con inercia
const salto = p => { p = clamp(p); const c = 1.70158 * 1.4; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const azar = s => { let x = Math.sin(s * 9301 + 49297) * 233280; return x - Math.floor(x); };
let G = null, MAN = {}, ELE = "";

/* ---------- Estrellas (siempre las mismas, titilan con t) ---------- */
const cv = document.getElementById("estrellas"), ctx = cv.getContext("2d");
cv.width = F.W; cv.height = F.H;
const ESTRELLAS = Array.from({ length: 160 }, (_, i) => ({ x: azar(i) * F.W, y: azar(i + 500) * F.H, r: 0.6 + azar(i + 900) * 1.8, f: azar(i + 1300) * 6.28, v: 4 + azar(i + 1700) * 10 }));
function fondo(t, junta) {
  const g = ctx.createRadialGradient(F.W * 0.7, F.H * 0.25, 40, F.W * 0.5, F.H * 0.5, Math.max(F.W, F.H) * 0.85);
  g.addColorStop(0, "#252C5A"); g.addColorStop(0.45, "#141932"); g.addColorStop(1, "#080A16");
  ctx.fillStyle = g; ctx.fillRect(0, 0, F.W, F.H);
  const ga = ctx.createRadialGradient(F.W * 0.2, F.H * 0.95, 10, F.W * 0.2, F.H * 0.95, F.W * 0.7);
  ga.addColorStop(0, "rgba(255,190,85,.10)"); ga.addColorStop(1, "rgba(255,190,85,0)");
  ctx.fillStyle = ga; ctx.fillRect(0, 0, F.W, F.H);
  ESTRELLAS.forEach((e, i) => {
    let x = (e.x + t * e.v) % F.W, y = e.y;
    if (junta != null) { const p = inercia(junta); x = lerp(x, F.W / 2, p * 0.85); y = lerp(y, F.H * 0.42, p * 0.85); }
    ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 2.2 + e.f));
    ctx.fillStyle = i % 9 === 0 ? "#FFC970" : "#DDE2FF";
    ctx.beginPath(); ctx.arc(x, y, e.r, 0, 6.283); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

/* ---------- Cámara: puntos con inercia ---------- */
const BASE = { s: 1, fx: 195, fy: 422, rx: 0, ry: 0, rz: 0, dx: 0, dy: 0, op: 1 };
function camara(kfs, tl) {
  // Cada punto hereda lo que no dice del anterior. Entre puntos, una curva continua (Hermite, tangentes de
  // Catmull-Rom): la cámara no frena en cada punto. Parte rápido (entra con inercia) y sigue derivando al final.
  const pts = []; let prev = Object.assign({}, BASE);
  kfs.forEach(([t, v]) => { prev = Object.assign({}, prev, v); pts.push([t, prev]); });
  const n = pts.length;
  if (n === 1 || tl <= pts[0][0]) return pts[0][1];
  if (tl >= pts[n - 1][0]) return pts[n - 1][1];
  let i = 0; while (i < n - 2 && tl > pts[i + 1][0]) i++;
  const [t0, a] = pts[i], [t1, b] = pts[i + 1], h = t1 - t0, u = (tl - t0) / h;
  const tang = (j, k) => {
    if (j === 0) return 1.8 * (pts[1][1][k] - pts[0][1][k]) / (pts[1][0] - pts[0][0]);            // sale rápido
    if (j === n - 1) return 0.5 * (pts[n - 1][1][k] - pts[n - 2][1][k]) / (pts[n - 1][0] - pts[n - 2][0]);   // y sigue derivando
    return (pts[j + 1][1][k] - pts[j - 1][1][k]) / (pts[j + 1][0] - pts[j - 1][0]);
  };
  const h00 = 2 * u * u * u - 3 * u * u + 1, h10 = u * u * u - 2 * u * u + u, h01 = -2 * u * u * u + 3 * u * u, h11 = u * u * u - u * u;
  const r = {};
  for (const k in BASE) r[k] = h00 * a[k] + h10 * h * tang(i, k) + h01 * b[k] + h11 * h * tang(i + 1, k);
  r.op = clamp(r.op);
  return r;
}
const ESC = 410 / 390;   // de la app a la pantalla del teléfono
function ponerTelefono(c) {
  const px = 15 + c.fx * ESC, py = 26 + c.fy * ESC;
  const tel = document.getElementById("tel");
  tel.style.opacity = c.op;
  const s = 1 + (c.s - 1) * F.zoom;   // en 16:9 el teléfono comparte el cuadro con el texto: se acerca menos
  tel.style.transform = `translate(${F.cx + c.dx * F.u}px, ${F.cy + c.dy * F.u}px) perspective(2200px) rotateX(${c.rx}deg) rotateY(${c.ry}deg) rotateZ(${c.rz}deg) scale(${F.k * s}) translate(${-px}px, ${-py}px)`;
}

/* ---------- Texto: palabra por palabra ---------- */
let textoDe = null;
function ponerTexto(esc, tl, dur) {
  const el = document.getElementById("texto");
  if (textoDe !== esc.id) {
    textoDe = esc.id; let n = 0;
    el.innerHTML = (esc.texto || []).map(l => `<span class="linea">${l.split(" ").map(w => {
      const acento = /\*/.test(w); w = w.replace(/\*/g, "");
      return `<span class="p${acento ? " acento" : ""}" data-i="${n++}">${w}</span>`;
    }).join(" ")}</span>`).join("") + (esc.etiquetas ? `<span class="linea"><span class="etq"></span></span>` : "");
  }
  const etq = el.querySelector(".etq");
  if (etq) {
    const [a, b] = esc.etiquetas, c = esc.despues.t, p = clamp((tl - c) / 0.45);
    const ma = a.match(/^(\D*)(\d+)(\D*)$/), mb = b.match(/^(\D*)(\d+)(\D*)$/);
    etq.textContent = ma && mb && ma[1] === mb[1] && ma[3] === mb[3] ? ma[1] + Math.round(lerp(+ma[2], +mb[2], inercia(p))) + ma[3] : (p < 0.5 ? a : b);
    etq.classList.toggle("ya", p >= 0.5);
    const pin = inercia((tl - 0.25) / 0.4), pout = clamp((tl - (dur - 0.22)) / 0.2);
    etq.style.opacity = pin * (1 - pout);
    etq.style.transform = `translateY(${(1 - pin) * 30}px) scale(${1 + (p > 0 && p < 1 ? Math.sin(p * Math.PI) * 0.12 : 0)})`;
  }
  el.querySelectorAll(".p").forEach(s => {
    const i = +s.dataset.i, pin = inercia((tl - 0.08 - i * 0.07) / 0.42), pout = clamp((tl - (dur - 0.22)) / 0.2);
    s.style.opacity = pin * (1 - pout);
    s.style.transform = `translateY(${(1 - pin) * 46 - pout * 24}px)`;
  });
}

/* ---------- El elefante del gancho ---------- */
function ponerElefante(cont, tl, modo) {
  const el = cont; if (!el.firstChild) el.innerHTML = ELE;
  const q = s => el.querySelector(s);
  if (modo === "camina") {
    const p = inercia(tl / 1.25), x = lerp(F.ele.x0, F.ele.x1, p), andando = p < 0.98;
    const bob = andando ? Math.abs(Math.sin(tl * 11)) * -14 : 0, rz = andando ? Math.sin(tl * 11) * 3 : 0;
    el.style.width = F.ele.w + "px"; el.style.height = F.ele.w * 240 / 260 + "px";
    el.style.transform = `translate(${x}px, ${F.ele.y - F.ele.w * 240 / 260 + bob}px) rotate(${rz}deg)`;
    const mira = clamp((tl - 1.2) / 0.3);
    const cab = q(".ele-cab"); if (cab) cab.setAttribute("transform", `rotate(${-8 * mira + Math.sin(tl * 3) * 2} 168 118)`);
  } else {
    const fase = (tl % 1.2) / 1.2, y = -Math.sin(fase * Math.PI) * 50 * (tl < 3.6 ? 1 : 0);
    el.style.transform = `translateY(${y}px)`;
  }
  const cola = q(".ele-cola"); if (cola) cola.setAttribute("transform", `rotate(${Math.sin(tl * 9) * 12} 54 142)`);
  const oreja = q(".ele-ear"); if (oreja) oreja.setAttribute("transform", `rotate(${Math.sin(tl * 6) * 5} 160 100)`);
}

/* ---------- Cierre ---------- */
function ponerCierre(esc, tl) {
  const c = document.getElementById("cierre"); c.hidden = false;
  const vertical = FORMATO === "916";
  const logo = c.querySelector(".logo"), img = logo.querySelector("img"), marca = c.querySelector(".marca"), frase = c.querySelector(".frase"), cta = c.querySelector(".cta"), e2 = c.querySelector(".ele2");
  img.style.width = img.style.height = (vertical ? 170 : 150) + "px";
  marca.style.fontSize = (vertical ? 150 : 140) + "px";
  frase.textContent = esc.frase; frase.style.fontSize = (vertical ? 76 : 70) + "px"; frase.style.marginTop = "40px";
  cta.textContent = esc.llamado; cta.style.fontSize = (vertical ? 40 : 38) + "px"; cta.style.padding = vertical ? "26px 44px" : "22px 40px"; cta.style.marginTop = "54px";
  const pl = salto((tl - 0.35) / 0.6), pf = inercia((tl - 0.95) / 0.5), pc = salto((tl - 1.45) / 0.55);
  logo.style.opacity = clamp(pl * 2); logo.style.transform = `scale(${0.6 + 0.4 * pl})`;
  frase.style.opacity = pf; frase.style.transform = `translateY(${(1 - pf) * 40}px)`;
  cta.style.opacity = clamp(pc * 2); cta.style.transform = `scale(${0.8 + 0.2 * pc})`;
  const w = vertical ? 260 : 220; e2.style.width = w + "px"; e2.style.height = w * 240 / 260 + "px";
  e2.style.left = (vertical ? F.W / 2 - w / 2 : F.W - w - 160) + "px"; e2.style.top = (vertical ? 1440 : 760) + "px";
  e2.style.opacity = clamp((tl - 1.9) / 0.3);
  ponerElefante(e2, Math.max(0, tl - 1.9), "salta");
  // fundido a negro en el último medio segundo, para que el video cierre limpio
  L.style.filter = `brightness(${1 - clamp((tl - (esc.hasta - esc.desde - 0.45)) / 0.45)})`;
}

/* ---------- Un cuadro ---------- */
async function cuadro(t) {
  const esc = G.escenas.find(e => t >= e.desde && t < e.hasta) || G.escenas[G.escenas.length - 1];
  const tl = t - esc.desde, dur = esc.hasta - esc.desde;
  const cierre = !!esc.cierre;
  fondo(t, cierre ? tl / 0.9 : null);
  L.style.filter = "none";
  document.getElementById("tel").style.display = cierre ? "none" : "";
  document.getElementById("texto").style.display = cierre ? "none" : (F.texto.align === "center" ? "block" : "flex");
  document.getElementById("cierre").hidden = !cierre;
  const ele = document.getElementById("ele"); ele.style.display = esc.elefante ? "" : "none";
  if (cierre) { ponerCierre(esc, tl); return; }
  ponerTelefono(camara(esc.camara, tl));
  ponerTexto(esc, tl, dur);
  if (esc.elefante) ponerElefante(ele, tl, "camina");
  // la toma de la app
  const img = document.getElementById("toma"), n = MAN[esc.toma] || 1;
  const i = Math.min(n - 1, Math.round((esc.tomaDesde + (esc.congelar ? 0 : tl)) * G.fps));
  const src = `tomas/${esc.toma}/${String(i).padStart(4, "0")}.jpg`;
  if (img.getAttribute("src") !== src) { img.setAttribute("src", src); try { await img.decode(); } catch (e) {} }
  // El contraste: la toma del «después» se revela de abajo hacia arriba con un barrido ámbar
  const img2 = document.getElementById("toma2"), barr = document.getElementById("barrido"), dp = esc.despues;
  if (dp && tl >= dp.t) {
    const n2 = MAN[dp.toma] || 1, i2 = Math.min(n2 - 1, Math.round((dp.tomaDesde + tl - dp.t) * G.fps));
    const src2 = `tomas/${dp.toma}/${String(i2).padStart(4, "0")}.jpg`;
    if (img2.getAttribute("src") !== src2) { img2.setAttribute("src", src2); try { await img2.decode(); } catch (e) {} }
    const p = inercia((tl - dp.t) / 0.45);
    img2.style.display = ""; img2.style.clipPath = `inset(${(1 - p) * 100}% 0 0 0)`;
    barr.style.top = (1 - p) * 888 + "px"; barr.style.opacity = p < 1 ? 1 : 0;
  } else { img2.style.display = "none"; barr.style.opacity = 0; }
  const en = esc.entrada;
  img.style.clipPath = en && en.tipo === "circulo" ? `circle(${inercia(tl / en.dur) * 1100}px at ${en.x * ESC}px ${en.y * ESC}px)` : "none";
  // el toque
  const tq = document.getElementById("toque"), toque = (esc.toques || []).find(q => tl >= q.t && tl < q.t + 0.55);
  if (toque) {
    const p = (tl - toque.t) / 0.55;
    tq.style.left = toque.x * ESC + "px"; tq.style.top = toque.y * ESC + "px";
    tq.style.opacity = p < 0.15 ? p / 0.15 : 1 - (p - 0.15) / 0.85;
    tq.style.transform = `scale(${0.7 + p * 0.9})`;
  } else tq.style.opacity = 0;
}

/* ---------- Arranque ---------- */
async function iniciar() {
  G = await (await fetch("escenas.json", { cache: "no-store" })).json();
  try { MAN = await (await fetch("tomas/manifiesto.json", { cache: "no-store" })).json(); } catch (e) {}
  ELE = await (await fetch("elefante.svg")).text();
  const t = document.getElementById("texto");
  Object.assign(t.style, F.texto.align === "center" ? { left: "60px", right: "60px", top: F.texto.top + "px", textAlign: "center" } : { left: F.texto.left + "px", width: "820px", top: "0", bottom: "0", display: "flex", flexDirection: "column", justifyContent: "center", textAlign: "left" });
  t.style.fontSize = F.texto.size + "px";
  const velo = document.getElementById("velo");
  velo.style.height = F.velo + "px"; velo.style.background = F.velo ? "linear-gradient(180deg, rgba(8,10,22,.82) 0%, rgba(8,10,22,.55) 60%, rgba(8,10,22,0) 100%)" : "linear-gradient(90deg, rgba(8,10,22,.85) 0%, rgba(8,10,22,.4) 40%, rgba(8,10,22,0) 55%)";
  if (!F.velo) { velo.style.height = "100%"; }
  document.getElementById("g-arriba").style.height = F.seguro.arriba * 100 + "%";
  document.getElementById("g-abajo").style.height = F.seguro.abajo * 100 + "%";
  if (Q.has("guia")) document.getElementById("guia").classList.add("ver");
  await document.fonts.ready;
  ajustar();
  window.listo = true;
  if (!Q.has("render")) {   // vista previa: se reproduce sola en el navegador
    const t0 = performance.now();
    const paso = async () => { await cuadro(((performance.now() - t0) / 1000) % G.duracion); requestAnimationFrame(paso); };
    paso();
  }
}
window.cuadro = cuadro;
iniciar();
</script>
</body>
</html>
