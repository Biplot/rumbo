name: Recordatorios de ritual

on:
  schedule:
    - cron: "*/15 * * * *"   # respaldo: en la práctica GitHub lo corre cada 3 a 7 horas, no cada 15 min
  workflow_dispatch: {}       # lo pide Supabase Cron cada 5 min (supabase/cron-recordatorios.sql); también sirve a mano

# Una pasada a la vez (si se juntan, la siguiente espera; notif_sent igual evita repetir avisos)
concurrency:
  group: recordatorios
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        working-directory: notifier
        run: npm install --no-audit --no-fund
      - name: Enviar recordatorios
        working-directory: notifier
        run: node send-rituals.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
