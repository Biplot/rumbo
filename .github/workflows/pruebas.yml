name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch: {}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests de lógica (fusión, registro diario, métricas, ritual semanal)
        env:
          TZ: America/Santiago
        run: node tests/merge.test.mjs
      - name: Instalar Playwright (solo para las pruebas; la app no lo usa)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Pruebas en navegador (escritorio y celular)
        env:
          TZ: America/Santiago
          E2E_SHOTS: capturas
        run: node tests/e2e/run.cjs
      - name: Guardar capturas si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: capturas
