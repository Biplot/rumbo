<!DOCTYPE html>
<html lang="es" data-theme="navy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rumbo · Un bocado a la vez</title>
  <meta name="description" content="Tu centro de control personal: finanzas, hábitos, metas, lecturas y bienestar en una sola app." />
  <!-- PWA / iPhone (agregar a pantalla de inicio) -->
  <meta name="theme-color" content="#0E2A47" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rumbo" />
  <link rel="apple-touch-icon" href="assets/icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="assets/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=68" />
</head>
<body>
  <!-- PORTAL DE USUARIOS -->
  <div id="authScreen" class="auth" hidden>
    <div class="auth__card">
      <div class="auth__brand">
        <svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true"><defs><mask id="bocadoA"><rect width="100" height="100" fill="#fff"/><circle cx="72" cy="31" r="13" fill="#000"/><circle cx="59" cy="21" r="8.5" fill="#000"/><circle cx="82" cy="45" r="8.5" fill="#000"/></mask></defs><rect x="2" y="2" width="96" height="96" rx="23" fill="#0E2A47" stroke="#17C3B2" stroke-width="3.5"/><circle cx="48" cy="54" r="32" fill="#17C3B2" mask="url(#bocadoA)"/><path d="M32 72 L54 50" stroke="#0E2A47" stroke-width="7.5" stroke-linecap="round"/><path d="M41 48 H55 V62" fill="none" stroke="#0E2A47" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="73" cy="30" r="5.5" fill="#FF6B4A"/></svg>
        <span class="brand-name">Rumbo</span>
      </div>
      <p class="auth__tagline">Un bocado a la vez.</p>

      <div id="auth-google" hidden>
        <button class="btn btn-google btn-block" data-action="auth-google">
          <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Continuar con Google</button>
        <div class="auth__o"><span>o con tu correo</span></div>
      </div>

      <div class="auth__tabs">
        <button class="auth__tab is-active" id="tab-login" data-action="auth-tab" data-tab="login">Iniciar sesión</button>
        <button class="auth__tab" id="tab-register" data-action="auth-tab" data-tab="register">Crear cuenta</button>
      </div>

      <div id="auth-error" class="auth__error" hidden></div>

      <div id="form-login" class="auth__form">
        <div class="field"><label>Correo</label><input class="input" type="email" id="log-email" placeholder="tu@correo.com"></div>
        <div class="field"><label>Contraseña</label><input class="input" type="password" id="log-pass" placeholder="••••••••"></div>
        <button class="btn btn--primary btn-block" data-action="auth-login">Entrar</button>
        <button class="linkish" data-action="auth-forgot">¿Olvidaste tu contraseña?</button>
      </div>

      <div id="form-register" class="auth__form" hidden>
        <div class="field"><label>Nombre</label><input class="input" id="reg-name" placeholder="Tu nombre"></div>
        <div class="field"><label>Correo</label><input class="input" type="email" id="reg-email" placeholder="tu@correo.com"></div>
        <div class="field"><label>Contraseña</label><input class="input" type="password" id="reg-pass" placeholder="Mínimo 6 caracteres"></div>
        <button class="btn btn--primary btn-block" data-action="auth-register">Crear mi cuenta</button>
      </div>

      <p class="auth__note">🔒 Tus datos se guardan de forma segura y privada en la nube.<br><a href="privacidad.html">Privacidad</a> · <a href="terminos.html">Términos</a></p>
    </div>
  </div>

  <div id="app" class="app" hidden>
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="30" height="30" aria-hidden="true"><defs><mask id="bocadoB"><rect width="100" height="100" fill="#fff"/><circle cx="72" cy="31" r="13" fill="#000"/><circle cx="59" cy="21" r="8.5" fill="#000"/><circle cx="82" cy="45" r="8.5" fill="#000"/></mask></defs><rect x="2" y="2" width="96" height="96" rx="23" fill="#0E2A47" stroke="#17C3B2" stroke-width="3.5"/><circle cx="48" cy="54" r="32" fill="#17C3B2" mask="url(#bocadoB)"/><path d="M32 72 L54 50" stroke="#0E2A47" stroke-width="7.5" stroke-linecap="round"/><path d="M41 48 H55 V62" fill="none" stroke="#0E2A47" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="73" cy="30" r="5.5" fill="#FF6B4A"/></svg>
        </div>
        <div class="brand-text">
          <span class="brand-name" id="brandName">Rumbo</span>
          <span class="brand-sub">un bocado a la vez</span>
        </div>
      </div>

      <button class="nav-dia" id="navDia" data-base="nav-dia" hidden></button>

      <nav class="nav" id="nav" aria-label="Menú"><!-- items injected --></nav>

      <div class="sidebar__foot">
        <button class="nav-pie" data-route="recompensas"><span class="nav__ico">🏆</span><span class="nav-pie__t">Recompensas</span><b id="navPts" class="nav-pie__pts"></b></button>
        <div class="cuenta-fila">
          <div class="account" id="accountBox"></div>
          <button class="cuenta-btn" id="cuentaBtn" data-action="cuenta-menu" aria-haspopup="menu" aria-expanded="false" aria-label="Menú de tu cuenta">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
        </div>
        <div class="cuenta-menu" id="cuentaMenu" role="menu" hidden>
          <button role="menuitem" data-route="cuenta">👤 Cuenta y avatar</button>
          <button role="menuitem" data-route="notif">🔔 Notificaciones</button>
          <button role="menuitem" data-route="tutoriales">🎓 Tutoriales y ayuda</button>
          <button role="menuitem" data-action="export">⭳ Respaldar datos</button>
          <button role="menuitem" data-action="logout" class="cuenta-menu__salir">↩ Cerrar sesión</button>
        </div>
      </div>
    </aside>

    <!-- Fondo para cerrar el menú en móvil -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- MAIN -->
    <div class="main">
      <header class="topbar">
        <div class="topbar__inner">
          <button class="hamburger" id="hamburger" aria-label="Menú" hidden>☰</button>
          <div class="topbar__title">
            <h1 id="pageTitle">Inicio</h1>
            <p id="pageSubtitle" class="muted"></p>
          </div>
          <button class="tour-help" id="helpBtn" data-action="tour-pantalla" title="Ayuda de esta pantalla" aria-label="Ayuda de esta pantalla" hidden>?</button>
          <div class="topbar__meta">
            <div class="save-status" id="saveStatus" hidden></div>
            <div class="pill pill--date" id="todayPill"></div>
            <button class="pill pill--streak" id="streakPill" data-action="info-racha" title="Días cerrados seguidos" aria-label="Días cerrados seguidos">🔥 <span id="streakVal">0</span><span class="pill__txt"> días cerrados</span></button>
            <button class="pill pill--pts" id="ptsPill" data-action="info-racha" title="Tus monedas" aria-label="Tus monedas">⭐ <span id="ptsVal">0</span></button>
          </div>
        </div>
      </header>

      <main class="view" id="view"><!-- module injected --></main>
    </div>

    <!-- Barra de navegación inferior (solo móvil) con el botón del día al centro -->
    <nav class="bottombar" id="bottombar" aria-label="Navegación principal"><!-- items injected --></nav>

    <!-- Hoja "Más" (móvil) -->
    <div class="sheet-overlay" id="masOverlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-label="Más"></section></div>
  </div>

  <!-- Modal genérico -->
  <div class="modal-overlay" id="modalOverlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <div class="modal__head">
        <h3 id="modalTitle">Título</h3>
        <button class="icon-btn" data-action="close-modal" aria-label="Cerrar">✕</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast" hidden></div>

  <!-- supabase-js 2.117.2 guardada en el repositorio: una versión nueva del CDN ya no puede romper el inicio de sesión -->
  <script src="js/vendor/supabase-2.117.2.js"></script>
  <script src="js/store.js?v=68"></script>
  <script src="js/state.js?v=68"></script>
  <script src="js/anios.js?v=68"></script>

  <script src="js/funciones.js?v=68"></script>

      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
